server.port=8080

# Threads virtuels : les attentes simulées (latences) ne saturent pas Tomcat
spring.threads.virtual.enabled=true

# Uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Pas de cache sur les ressources statiques (pages toujours à jour)
spring.web.resources.cache.period=0

# Latence simulée par défaut sur l'API (modifiable à chaud via /api/admin/settings)
testapp.latency.default-ms=300
testapp.latency.jitter-ms=0

# Réponses au compte-gouttes (/api/latence) : jusqu'à 30 s de corps, plus la latence simulée
spring.mvc.async.request-timeout=90s
