<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Socle TestApp</title>
  <link rel="stylesheet" href="classic/css/app.css">
</head>
<body>
<header class="site-header">
  <span class="brand">Socle TestApp</span>
</header>
<main>
  <div class="page-intro">
    <h1 id="page-title">Socle TestApp</h1>
    <p>Application factice de validation du socle d'automatisation web. Le même catalogue de scénarios est proposé avec plusieurs technologies front.</p>
  </div>
  <section class="card">
    <h2>Fronts disponibles</h2>
    <div class="grid">
      <a id="front-classic" class="btn" href="classic/">Classic<br><small>HTML + jQuery (Ajax) — disponible</small></a>
      <span id="front-react" class="btn" aria-disabled="true">React<br><small>à venir</small></span>
      <span id="front-vue" class="btn" aria-disabled="true">Vue.js<br><small>à venir</small></span>
      <span id="front-angular" class="btn" aria-disabled="true">Angular<br><small>à venir</small></span>
    </div>
  </section>
</main>
<script>
  // Version déployée, affichée en permanence dans l'en-tête
  (function () {
    var header = document.querySelector('.site-header');
    var span = document.createElement('span');
    span.id = 'app-version';
    span.setAttribute('data-testid', 'app-version');
    span.className = 'app-version';
    span.textContent = 'version …';
    header.appendChild(span);
    fetch('api/version').then(function (r) { return r.json(); }).then(function (v) {
      span.textContent = 'v' + v.version + (v.buildTime ? ' · ' + v.buildTime : '') + ' · ' + v.commit;
      span.setAttribute('data-version', v.version);
    }).catch(function () {
      span.textContent = 'version inconnue';
    });
  })();
</script>
</body>
</html>
